plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.saeanyang'
version = '1.0.0'
description = '주보 관리'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.apache.poi:poi:5.2.5'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'org.projectlombok:lombok:1.18.30'
	implementation 'io.github.cdimascio:dotenv-java:3.0.0'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
	archiveBaseName = 'church-management'
}

// ===== 앱 패키징 (jpackage) =====
// macOS : ./gradlew packageApp          → build/dist/ChurchManagement.app
// Windows: ./gradlew packageApp         → build/dist/ChurchManagement/ChurchManagement.exe
//          ./gradlew packageAppInstaller → build/dist/ChurchManagement-1.0.0.msi  (msi 설치파일)
tasks.register('packageApp', Exec) {
	dependsOn 'bootJar'
	description = 'jpackage로 네이티브 앱 번들을 생성합니다. (macOS: .app  Windows: .exe)'

	def jarName = bootJar.archiveFileName.get()
	def jpackageBin = "${System.getProperty('java.home')}/bin/jpackage"
	def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

	doFirst {
		def distDir = file('build/dist')
		if (distDir.exists()) distDir.deleteDir()
		distDir.mkdirs()
	}

	def cmd = [jpackageBin,
		'--input', 'build/libs',
		'--main-jar', jarName,
		'--name', 'ChurchManagement',
		'--app-version', version,
		'--description', '주보 관리',
		'--type', 'app-image',
		'--dest', 'build/dist',
		'--java-options', '-Djava.awt.headless=false',
		'--java-options', '-Xmx512m']

	if (!isWindows) {
		// macOS 전용 옵션
		cmd += ['--java-options', '-Dapple.awt.application.name=ChurchManagement']
	}

	commandLine cmd
}

// Windows 전용: MSI 설치 파일 생성 (WiX Toolset 필요)
tasks.register('packageAppInstaller', Exec) {
	dependsOn 'bootJar'
	description = 'Windows용 MSI 설치 파일을 생성합니다. (WiX Toolset 필요)'

	def jarName = bootJar.archiveFileName.get()
	def jpackageBin = "${System.getProperty('java.home')}/bin/jpackage"

	doFirst {
		def distDir = file('build/dist-installer')
		if (distDir.exists()) distDir.deleteDir()
		distDir.mkdirs()
	}

	commandLine jpackageBin,
		'--input', 'build/libs',
		'--main-jar', jarName,
		'--name', 'ChurchManagement',
		'--app-version', version,
		'--description', '주보 관리',
		'--type', 'msi',
		'--dest', 'build/dist-installer',
		'--java-options', '-Djava.awt.headless=false',
		'--java-options', '-Xmx512m',
		'--win-menu',
		'--win-shortcut',
		'--win-dir-chooser'
}
