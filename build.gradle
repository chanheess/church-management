plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.saeanyang'
version = '1.0.0'
description = '주보 관리'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.apache.poi:poi:5.2.5'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'org.projectlombok:lombok:1.18.30'
	implementation 'io.github.cdimascio:dotenv-java:3.0.0'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
	archiveBaseName = 'church-management'
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def jpackageBin = "${System.getProperty('java.home')}/bin/jpackage${isWindows ? '.exe' : ''}"

// ===== 앱 패키징 (jpackage) =====
// macOS : ./gradlew packageApp         → build/dist/ChurchManagement.app
// Windows: ./gradlew packageApp        → build/dist/ChurchManagement-1.0.0.exe  (설치파일)
// Windows: ./gradlew packagePortableApp → build/dist/ChurchManagement/ChurchManagement.exe  (폴더형)
tasks.register('packageApp', Exec) {
	dependsOn 'bootJar'
	description = 'jpackage로 기본 배포본을 생성합니다. (macOS: .app, Windows: 설치형 .exe)'

	doFirst {
		def distDir = file('build/dist')
		if (distDir.exists()) distDir.deleteDir()
		distDir.mkdirs()

		def jarName = bootJar.archiveFileName.get()
		def packageType = isWindows ? 'exe' : 'app-image'
		def cmd = [jpackageBin,
			'--input', layout.buildDirectory.dir('libs').get().asFile.absolutePath,
			'--main-jar', jarName,
			'--name', 'ChurchManagement',
			'--app-version', version,
			'--description', '주보 관리',
			'--type', packageType,
			'--dest', layout.buildDirectory.dir('dist').get().asFile.absolutePath,
			'--java-options', '-Djava.awt.headless=false',
			'--java-options', '-Xmx512m']

		if (isWindows) {
			cmd += [
				'--win-menu',
				'--win-shortcut',
				'--win-dir-chooser',
				'--win-per-user-install'
			]
		} else {
			cmd += ['--java-options', '-Dapple.awt.application.name=ChurchManagement']
		}

		commandLine cmd
	}
}

tasks.register('packagePortableApp', Exec) {
	dependsOn 'bootJar'
	description = 'jpackage로 폴더형 앱 번들을 생성합니다. (macOS: .app, Windows: app-image 폴더)'

	doFirst {
		def distDir = file('build/dist')
		if (distDir.exists()) distDir.deleteDir()
		distDir.mkdirs()

		def jarName = bootJar.archiveFileName.get()
		def cmd = [jpackageBin,
			'--input', layout.buildDirectory.dir('libs').get().asFile.absolutePath,
			'--main-jar', jarName,
			'--name', 'ChurchManagement',
			'--app-version', version,
			'--description', '주보 관리',
			'--type', 'app-image',
			'--dest', layout.buildDirectory.dir('dist').get().asFile.absolutePath,
			'--java-options', '-Djava.awt.headless=false',
			'--java-options', '-Xmx512m']

		if (!isWindows) {
			cmd += ['--java-options', '-Dapple.awt.application.name=ChurchManagement']
		}

		commandLine cmd
	}
}

// Windows 전용: EXE 설치 파일 생성
tasks.register('packageWindowsExe', Exec) {
	dependsOn 'bootJar'
	description = 'Windows용 EXE 설치 파일을 생성합니다.'

	doFirst {
		if (!isWindows) {
			throw new GradleException('packageWindowsExe는 Windows에서만 실행할 수 있습니다.')
		}

		def distDir = file('build/dist-installer')
		if (distDir.exists()) distDir.deleteDir()
		distDir.mkdirs()

		def jarName = bootJar.archiveFileName.get()
		commandLine jpackageBin,
			'--input', layout.buildDirectory.dir('libs').get().asFile.absolutePath,
			'--main-jar', jarName,
			'--name', 'ChurchManagement',
			'--app-version', version,
			'--description', '주보 관리',
			'--type', 'exe',
			'--dest', layout.buildDirectory.dir('dist-installer').get().asFile.absolutePath,
			'--java-options', '-Djava.awt.headless=false',
			'--java-options', '-Xmx512m',
			'--win-menu',
			'--win-shortcut',
			'--win-dir-chooser',
			'--win-per-user-install'
	}
}
