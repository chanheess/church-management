spring:
  application:
    name: weekly-bulletin
  main:
    headless: false

bulletin:
  excel:
    path: ${BULLETIN_EXCEL_PATH:}
  logo:
    path: ${BULLETIN_LOGO_PATH:}
  illustration:
    folder: ${BULLETIN_ILLUSTRATIONS_PATH:}
  text:
    path: ${BULLETIN_TEXT_PATH:${user.home}/.church-management/text-config.properties}
  representative-prayer:
    path: ${BULLETIN_REPRESENTATIVE_PRAYER_PATH:${user.home}/.church-management/representative-prayer.json}

server:
  port: 8082

app:
  security:
    # 개인정보(생년월일·전화번호) 암호화 키 — base64 인코딩된 32바이트(AES-256).
    # APP_PII_KEY 환경변수/.env(로컬)·Compose secret(운영)으로 주입(.env·소스 커밋 금지).
    # 미설정 시 기동 중단(fail-fast) — 임시키로 기동하면 재시작 후 기존 암호문을 복호화할 수 없기 때문.
    pii-key: ${APP_PII_KEY:}
