spring:
  application:
    name: weekly-bulletin
  main:
    headless: false
  mail:
    # 실제 이메일 발송을 하려면 SMTP 값을 환경변수로 설정한다.
    # Gmail 예:
    # MAIL_HOST=smtp.gmail.com
    # MAIL_PORT=587
    # MAIL_USERNAME=your-email@gmail.com
    # MAIL_PASSWORD=앱_비밀번호
    # MAIL_SMTP_AUTH=true
    # MAIL_SMTP_STARTTLS=true
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

bulletin:
  excel:
    path: ${BULLETIN_EXCEL_PATH:}
  logo:
    path: ${BULLETIN_LOGO_PATH:}
  illustration:
    folder: ${BULLETIN_ILLUSTRATIONS_PATH:}
  text:
    path: ${BULLETIN_TEXT_PATH:${user.home}/.church-management/text-config.properties}
  representative-prayer:
    path: ${BULLETIN_REPRESENTATIVE_PRAYER_PATH:${user.home}/.church-management/representative-prayer.json}

excel:
  # local(기본) 또는 google-drive. Drive 모드는 서비스계정에 대상 파일 읽기 권한을 공유해야 한다.
  source: ${EXCEL_SOURCE:local}
  google-drive:
    file-id: ${GOOGLE_DRIVE_FILE_ID:}
    credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:}
    cache-path: ${GOOGLE_DRIVE_CACHE_PATH:${user.home}/.church-management/active.xlsx}
    poll-interval: ${GOOGLE_DRIVE_POLL_INTERVAL:PT5M}

server:
  port: 8082

app:
  security:
    # 개인정보(생년월일·전화번호) 암호화 키 — base64 인코딩된 32바이트(AES-256).
    # APP_PII_KEY 환경변수/.env(로컬)·Compose secret(운영)으로 주입(.env·소스 커밋 금지).
    # 미설정 시 기동 중단(fail-fast) — 임시키로 기동하면 재시작 후 기존 암호문을 복호화할 수 없기 때문.
    pii-key: ${APP_PII_KEY:}
  desktop:
    enabled: true

security:
  signup:
    # 회원가입은 아래 IP 또는 CIDR에서만 허용된다.
    # 예:
    # - 127.0.0.1/32        # 로컬 개발
    # - 192.168.0.10/32     # 특정 PC 1대
    # - 192.168.0.0/24      # 내부 네트워크 대역
    allowed-networks:
      - ${SECURITY_SIGNUP_ALLOWED_NETWORK_1:127.0.0.1/32}
      - ${SECURITY_SIGNUP_ALLOWED_NETWORK_2:0:0:0:0:0:0:0:1/128}
      - ::1
  email-verification:
    code-ttl-minutes: 10
    max-attempts: 5
    trusted-device-days: 30
    log-code-when-mail-fails: ${SECURITY_EMAIL_VERIFICATION_LOG_CODE_WHEN_MAIL_FAILS:true}
    from: ${SECURITY_MAIL_FROM:no-reply@church-management.local}
