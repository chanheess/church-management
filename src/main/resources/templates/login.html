<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f7f9;
            color: #20242a;
        }
        main {
            width: min(400px, calc(100vw - 32px));
            background: #fff;
            border: 1px solid #d9dde3;
            border-radius: 8px;
            padding: 28px;
            box-sizing: border-box;
        }
        h1 {
            margin: 0 0 20px;
            font-size: 22px;
        }
        label {
            display: block;
            margin-top: 14px;
            font-weight: 700;
            font-size: 14px;
        }
        input {
            width: 100%;
            height: 42px;
            margin-top: 6px;
            padding: 0 10px;
            border: 1px solid #c9ced6;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            height: 44px;
            margin-top: 22px;
            border: 0;
            border-radius: 6px;
            background: #1f6feb;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .secondary-link {
            display: block;
            margin-top: 16px;
            text-align: center;
            color: #1f6feb;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }
        .secondary-link:focus,
        .secondary-link:hover {
            text-decoration: underline;
        }
        .message {
            margin: 0 0 14px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        .error {
            background: #fff1f0;
            color: #b42318;
        }
        .success {
            background: #ecfdf3;
            color: #027a48;
        }
    </style>
</head>
<body>
<main>
    <h1>로그인</h1>
    <p class="message error" th:if="${param.error}">이메일 또는 비밀번호가 올바르지 않습니다.</p>
    <p class="message success" th:if="${param.logout}">로그아웃되었습니다.</p>
    <p class="message success" th:if="${param.signup}">회원가입이 완료되었습니다.</p>

    <form th:action="@{/login}" method="post">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">로그인</button>
    </form>
    <a class="secondary-link" th:href="@{/signup}">회원가입</a>
</main>
</body>
</html>
