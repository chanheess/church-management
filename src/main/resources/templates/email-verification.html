<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 인증</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f7f9;
            color: #20242a;
        }
        main {
            width: min(400px, calc(100vw - 32px));
            background: #fff;
            border: 1px solid #d9dde3;
            border-radius: 8px;
            padding: 28px;
            box-sizing: border-box;
        }
        h1 {
            margin: 0 0 20px;
            font-size: 22px;
        }
        label {
            display: block;
            font-weight: 700;
            font-size: 14px;
        }
        input {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            padding: 0 12px;
            border: 1px solid #c9ced6;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 20px;
            letter-spacing: 0;
            text-align: center;
        }
        button {
            width: 100%;
            height: 44px;
            margin-top: 18px;
            border: 0;
            border-radius: 6px;
            background: #1f6feb;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .error {
            margin-bottom: 14px;
            color: #b42318;
            font-size: 14px;
        }
    </style>
</head>
<body>
<main>
    <h1>이메일 인증</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/login/email-verification}" method="post">
        <label for="code">인증 코드</label>
        <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus>
        <button type="submit">인증</button>
    </form>
</main>
</body>
</html>
