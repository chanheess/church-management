<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 제한</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f7f9;
            color: #20242a;
        }
        main {
            width: min(440px, calc(100vw - 32px));
            background: #fff;
            border: 1px solid #d9dde3;
            border-radius: 8px;
            padding: 28px;
            box-sizing: border-box;
        }
        h1 {
            margin: 0 0 14px;
            font-size: 22px;
        }
        p {
            margin: 10px 0;
            line-height: 1.5;
        }
        code {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            background: #eef1f5;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        a {
            display: inline-block;
            margin-top: 14px;
            color: #1f6feb;
            font-weight: 700;
            text-decoration: none;
        }
        a:focus,
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<main>
    <h1>회원가입 제한</h1>
    <p>회원가입은 허용된 IP에서만 가능합니다.</p>
    <p>현재 접속 IP: <code th:text="${blockedIp}">unknown</code></p>
    <a th:href="@{/login}">로그인으로 이동</a>
</main>
</body>
</html>
