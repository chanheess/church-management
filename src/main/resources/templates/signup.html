<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f7f9;
            color: #20242a;
        }
        main {
            width: min(420px, calc(100vw - 32px));
            background: #fff;
            border: 1px solid #d9dde3;
            border-radius: 8px;
            padding: 28px;
            box-sizing: border-box;
        }
        h1 {
            margin: 0 0 20px;
            font-size: 22px;
        }
        label {
            display: block;
            margin-top: 14px;
            font-weight: 700;
            font-size: 14px;
        }
        input {
            width: 100%;
            height: 42px;
            margin-top: 6px;
            padding: 0 10px;
            border: 1px solid #c9ced6;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            height: 44px;
            margin-top: 22px;
            border: 0;
            border-radius: 6px;
            background: #1f6feb;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .error {
            margin-top: 8px;
            color: #b42318;
            font-size: 13px;
        }
    </style>
</head>
<body>
<main>
    <h1>회원가입</h1>
    <form th:action="@{/signup}" th:object="${signupRequest}" method="post">
        <label for="email">이메일</label>
        <input id="email" type="email" th:field="*{email}" autocomplete="username" required>
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label for="password">비밀번호</label>
        <input id="password" type="password" th:field="*{password}" autocomplete="new-password" required>
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <label for="passwordConfirm">비밀번호 확인</label>
        <input id="passwordConfirm" type="password" th:field="*{passwordConfirm}" autocomplete="new-password" required>
        <div class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>

        <button type="submit">가입</button>
    </form>
</main>
</body>
</html>
