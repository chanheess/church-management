services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: church-management-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: server
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      SECURITY_MAIL_FROM: ${SECURITY_MAIL_FROM:-no-reply@church-management.local}
      SECURITY_EMAIL_VERIFICATION_LOG_CODE_WHEN_MAIL_FAILS: ${SECURITY_EMAIL_VERIFICATION_LOG_CODE_WHEN_MAIL_FAILS:-false}
      SECURITY_SIGNUP_ALLOWED_NETWORK_1: ${SECURITY_SIGNUP_ALLOWED_NETWORK_1}
      SECURITY_SIGNUP_ALLOWED_NETWORK_2: ${SECURITY_SIGNUP_ALLOWED_NETWORK_2:-}
      BULLETIN_TEXT_PATH: /data/text-config.properties
      BULLETIN_REPRESENTATIVE_PRAYER_PATH: /data/representative-prayer.json
    ports:
      - "${APP_PORT:-8082}:8082"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: church-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-data:
  postgres-data:
